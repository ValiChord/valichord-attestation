# Publish valichord-attestation to PyPI when a GitHub release is published.
#
# Uses PyPI trusted publishing (OIDC): no API token is stored anywhere. PyPI is
# told once, on its own website, to trust this repository's `publish.yml` in the
# `pypi` environment; after that only a release made here can publish.
#
# The build runs the full test suite and the example verification first. A
# release whose tag does not match pyproject's version is refused rather than
# published under the wrong number.
name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tag must match the package version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "${GITHUB_REF_NAME#v}" = "$v" || { echo "tag $GITHUB_REF_NAME != pyproject version $v"; exit 1; }
      - name: Test before publishing
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q
          python examples/verify_examples.py
      - name: Build
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
